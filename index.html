<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리컵맵 | 다회용의 좋은 순환</title><style>
:root{--green:#175c47;--dark:#17352c;--light:#e8f3ec;--yellow:#f3cb69;--muted:#61736a;--border:#dfe8e1}*{box-sizing:border-box}body{margin:0;background:#f5f7f2;color:var(--dark);font:15px/1.5 system-ui,'Apple SD Gothic Neo',sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid var(--border)}.top{max-width:1120px;margin:auto;padding:17px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}.logo{font-size:22px;font-weight:900;letter-spacing:-1px;color:var(--green)}.logo span{color:#7aaa75}.tag{font-size:12px;color:#506b5a;background:#eff5ed;padding:6px 10px;border-radius:20px}.layout{max-width:1120px;margin:auto;padding:32px 22px 80px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:2px;color:#688979;font-weight:800}.hero h1{font-size:clamp(27px,4vw,40px);letter-spacing:-1.7px;line-height:1.25;margin:8px 0}.hero p{color:var(--muted);margin:0}.points{background:var(--green);color:white;border-radius:20px;padding:19px 23px;min-width:190px}.points small{color:#d3e6d9}.points strong{display:block;font-size:27px;margin-top:3px}.tabs{display:flex;gap:8px;overflow:auto;margin:0 0 23px}.tab{white-space:nowrap;background:#fff;border:1px solid var(--border);border-radius:30px;padding:10px 17px;color:#53675b;font-weight:700}.tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:20px}.card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:23px}.card h2,.card h3{margin:0 0 5px}.sub{font-size:13px;color:var(--muted);margin:0 0 17px}.map{position:relative;height:250px;overflow:hidden;border-radius:15px;background-color:#e6efe3;background-image:linear-gradient(32deg,transparent 47%,#fff 48%,#fff 51%,transparent 52%),linear-gradient(130deg,transparent 42%,#f8faf4 43%,#f8faf4 47%,transparent 48%),linear-gradient(90deg,transparent 65%,#d8e9d5 66%);background-size:190px 120px,250px 180px,100% 100%}.map:after{content:'예시 위치도 · 실제 지도가 아닙니다';position:absolute;bottom:10px;left:12px;background:#ffffffdd;border-radius:6px;padding:3px 8px;font-size:11px}.pin{position:absolute;border:0;border-radius:20px;background:var(--green);color:white;padding:8px 10px;box-shadow:0 3px 8px #0002;font-size:12px;font-weight:700}.list{display:grid;gap:10px}.cafe{border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.cafe strong{font-size:16px}.cafe small{color:var(--muted);display:block;margin-top:4px}.pill{font-size:11px;color:var(--green);background:var(--light);border-radius:20px;padding:4px 8px;font-weight:700}.btn{border:0;background:var(--green);color:white;border-radius:10px;padding:10px 15px;font-weight:700}.btn.secondary{background:#eef4ee;color:var(--green)}.btn:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.field{display:block;width:100%;padding:11px;border:1px solid #d5e1d7;border-radius:10px;background:#fff;color:var(--dark);margin:6px 0 12px}.label{font-weight:700;font-size:13px}.notice{background:#fff8e7;color:#765a20;border-radius:12px;padding:13px 15px;font-size:13px;margin:15px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:4px}.item{padding:14px 0;border-bottom:1px solid #edf1ed}.item:last-child{border:0}.empty{text-align:center;padding:40px 10px;color:var(--muted)}.rank{display:grid;grid-template-columns:40px 1fr auto;align-items:center;padding:14px 5px;border-bottom:1px solid #edf1ed}.rank b:first-child{color:var(--green);font-size:20px}.mine{background:#edf7ef;border-radius:10px}.foot{margin-top:25px;color:#718176;font-size:12px}.dialog{border:0;border-radius:20px;padding:0;max-width:480px;width:calc(100% - 30px);box-shadow:0 18px 80px #0003}.dialog::backdrop{background:#172b22aa}.dialog-inner{padding:24px}.close{border:0;background:#f0f4ef;border-radius:50%;width:32px;height:32px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.danger{color:#a54b39} @media(max-width:700px){.hero{align-items:start}.points{min-width:135px;padding:15px}.points strong{font-size:22px}.grid{grid-template-columns:1fr}.layout{padding:24px 16px 60px}.top{padding:14px 16px}.stats{gap:7px}.stat{padding:13px}.stat strong{font-size:19px}.hero h1{font-size:27px}}
</style></head><body><header><div class="top"><div class="logo">♻ recup<span>map.</span></div><span class="tag">브라우저 체험판</span></div></header><main class="layout"><div class="hero"><div><div class="eyebrow">SMALL CIRCLES, BIG CHANGE</div><h1>오늘의 반납이<br>내일의 변화를 만들어요.</h1><p>가까운 카페에서 시작하는 다회용 생활</p></div><div class="points"><small>나의 친환경 포인트</small><strong id="pointTop">0 P</strong></div></div><nav class="tabs" aria-label="메인 메뉴"><button class="tab active" data-tab="explore">카페 찾기</button><button class="tab" data-tab="rentals">내 대여</button><button class="tab" data-tab="points">포인트</button><button class="tab" data-tab="rank">지역 순위</button><button class="tab" data-tab="operator">카페 운영</button><button class="tab" data-tab="admin">관리자</button></nav><div id="app"></div><p class="foot">체험용 가상 데이터입니다. 실제 카페·지도·결제·QR·계정에 연결되지 않으며, 정보는 이 브라우저에만 저장됩니다.</p></main><dialog id="modal" class="dialog"><div class="dialog-inner" id="modalBody"></div></dialog><script>
'use strict';
const KEY='recupmap_demo_v1';const samples=[{id:'s1',name:'그린리프 커피 (예시)',address:'서울 마포구 연남로 12 (예시)',phone:'02-000-0000',hours:'09:00–19:00',stock:8,wash:0,status:'approved'},{id:'s2',name:'순환 카페 (예시)',address:'서울 마포구 월드컵북로 20 (예시)',phone:'02-000-0000',hours:'10:00–20:00',stock:5,wash:0,status:'approved'},{id:'s3',name:'느린 오후 (예시)',address:'서울 마포구 망원로 36 (예시)',phone:'02-000-0000',hours:'09:30–18:30',stock:3,wash:0,status:'approved'}];
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.cafes)){state={cafes:samples,points:500,rentals:[],ledger:[{text:'체험 시작 포인트',amount:500,date:new Date().toISOString()}],region:'서울 마포구',public:true}}let tab='explore',query='';const app=document.getElementById('app'),modal=document.getElementById('modal');
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function num(n){return Number(n).toLocaleString('ko-KR')}function date(s){return new Date(s).toLocaleDateString('ko-KR')}function cafes(){return state.cafes.filter(c=>c.status==='approved')}function show(content){document.getElementById('modalBody').innerHTML='<div class="row between"><strong>리컵맵</strong><button class="close" onclick="modal.close()" aria-label="닫기">✕</button></div>'+content;modal.showModal()}function setTab(t){tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function render(){document.getElementById('pointTop').textContent=num(state.points)+' P';if(tab==='explore')explore();if(tab==='rentals')rentals();if(tab==='points')points();if(tab==='rank')rank();if(tab==='operator')operator();if(tab==='admin')admin()}
function explore(){let filtered=cafes().filter(c=>(c.name+' '+c.address).toLowerCase().includes(query.toLowerCase()));app.innerHTML=`<div class="grid"><section class="card"><div class="row between"><div><h2>내 주변 카페</h2><p class="sub">함께 만드는 좋은 순환을 찾아보세요</p></div><span class="pill">위치도 예시</span></div><div class="map">${filtered.slice(0,5).map((c,i)=>`<button class="pin" style="left:${8+(i*19)%70}%;top:${18+(i*27)%60}%" onclick="detail('${c.id}')">☕ ${esc(c.name)}</button>`).join('')}</div><p class="sub" style="margin:12px 0 0">마커 위치는 임의 배치입니다. 실제 위치·거리와 무관합니다.</p></section><section class="card"><h2>참여 카페</h2><p class="sub">승인된 카페만 볼 수 있어요</p><input class="field" id="search" placeholder="카페명 또는 주소 검색" value="${esc(query)}"><div class="list">${filtered.map(c=>`<div class="cafe"><div><strong>${esc(c.name)}</strong> <span class="pill">등록 승인</span><small>${esc(c.address)}</small><small>대여 가능 컵 ${c.stock}개 · 세척 대기 ${c.wash||0}개</small></div><button class="btn secondary" onclick="detail('${c.id}')">상세</button></div>`).join('')||'<div class="empty">검색 결과가 없습니다.</div>'}</div></section></div>`;document.getElementById('search').oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;explore();let el=document.getElementById('search');el.focus();el.setSelectionRange(pos,pos)}}
function detail(id){let c=state.cafes.find(x=>x.id===id);if(!c)return;show(`<h2>${esc(c.name)}</h2><p class="sub">등록 승인 · 체험용 정보</p><div class="item">📍 ${esc(c.address)}</div><div class="item">☎ ${esc(c.phone)}<br>🕒 ${esc(c.hours)}</div><div class="item">다회용 컵 <b>${c.stock}개</b> 이용 가능<br><small>재고는 실제 매장과 무관한 예시입니다.</small></div><p class="notice">대여료 200원 · 보증금 1,000원 (체험 예시). 실제 결제는 발생하지 않습니다.</p><button class="btn" ${c.stock<1?'disabled':''} onclick="rentForm('${c.id}')">${c.stock<1?'대여 가능 재고 없음':'대여 체험하기'}</button>`)}
function rentForm(id){let c=state.cafes.find(x=>x.id===id);document.getElementById('modalBody').innerHTML=`<div class="row between"><h2>대여 확인</h2><button class="close" onclick="modal.close()">✕</button></div><p class="sub">${esc(c.name)} · 다회용 컵 1개</p><div class="item">대여료 200원 · 보증금 1,000원<br>반납 기한: 대여일로부터 7일</div><label class="label" for="benefit">포인트 혜택 (중복 불가)</label><select class="field" id="benefit" onchange="benefitPreview()"><option value="none">사용하지 않음</option><option value="fee">대여료 200P 사용</option><option value="deposit">보증금 면제 300P 사용</option></select><div id="preview"></div><p class="notice">결제와 QR 확인을 흉내 내는 체험입니다. 면제 포인트는 소모되며, 실제 반납 의무·결제는 발생하지 않습니다.</p><button class="btn" onclick="rent('${id}')">대여 확정</button>`;benefitPreview()}
function benefitPreview(){let b=document.getElementById('benefit').value,cost=b==='fee'?200:b==='deposit'?300:0;document.getElementById('preview').innerHTML=`<div class="item">사용 ${cost}P · 적용 후 ${num(state.points-cost)}P<br>대여료 ${b==='fee'?0:200}원 · 보증금 ${b==='deposit'?'면제':'1,000원'} <small>(모두 모의 처리)</small></div>${cost>state.points?'<p class="danger">포인트가 부족합니다.</p>':''}`}
function rent(id){let c=state.cafes.find(x=>x.id===id),b=document.getElementById('benefit').value,cost=b==='fee'?200:b==='deposit'?300:0;if(!c||c.status!=='approved'||c.stock<1)return alert('대여 가능한 재고가 없습니다.');if(state.points<cost)return alert('포인트가 부족합니다.');state.points-=cost;if(cost)state.ledger.unshift({text:b==='fee'?'대여료 포인트 사용':'보증금 면제 포인트 사용',amount:-cost,date:new Date().toISOString()});c.stock--;state.rentals.unshift({id:'r'+Date.now(),cafeId:id,cafe:c.name,created:new Date().toISOString(),due:new Date(Date.now()+7*86400000).toISOString(),returned:false,benefit:b});save();modal.close();setTab('rentals')}
function rentals(){let active=state.rentals.filter(r=>!r.returned),done=state.rentals.filter(r=>r.returned);app.innerHTML=`<div class="stats"><div class="stat"><small>대여 중</small><strong>${active.length}개</strong></div><div class="stat"><small>반납 완료</small><strong>${done.length}개</strong></div><div class="stat"><small>반납 적립</small><strong>+100P / 개</strong></div></div><section class="card"><h2>나의 다회용 생활</h2><p class="sub">반납은 운영자 확인을 대신하는 모의 버튼으로 처리합니다.</p>${state.rentals.length?state.rentals.map(r=>`<div class="cafe"><div><strong>다회용 컵 1개</strong> <span class="pill">${r.returned?'반납 완료':'대여 중'}</span><small>${esc(r.cafe)} · 대여 ${date(r.created)} · 기한 ${date(r.due)}</small></div>${r.returned?'':`<button class="btn" onclick="returnForm('${r.id}')">반납 체험</button>`}</div>`).join(''):'<div class="empty">아직 대여 내역이 없어요.<br>카페를 찾아 첫 순환을 시작해 보세요.</div>'}</section>`}
function returnForm(id){let r=state.rentals.find(x=>x.id===id);if(!r||r.returned)return;show(`<h2>반납 확인</h2><p class="sub">실제 QR 확인과 매장 검수는 구현되지 않았습니다.</p><label class="label" for="returnCafe">반납할 카페</label><select id="returnCafe" class="field">${cafes().map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><p class="notice">운영자가 컵 1개를 확인했다고 가정합니다. 반납을 확정하면 100P가 적립되고 세척 대기 재고로 기록됩니다.</p><button class="btn" onclick="doReturn('${id}')">모의 반납 확정 · +100P</button>`)}
function doReturn(id){let r=state.rentals.find(x=>x.id===id),c=state.cafes.find(x=>x.id===document.getElementById('returnCafe').value&&x.status==='approved');if(!r||r.returned||!c)return alert('반납할 수 없습니다.');r.returned=true;r.returnDate=new Date().toISOString();r.returnCafe=c.name;r.region=state.region;c.wash=(c.wash||0)+1;state.points+=100;state.ledger.unshift({text:'용기 반납 적립 · '+c.name,amount:100,date:r.returnDate});save();modal.close();render()}
function points(){app.innerHTML=`<div class="stats"><div class="stat"><small>사용 가능 포인트</small><strong>${num(state.points)} P</strong></div><div class="stat"><small>반납 적립</small><strong>100 P / 개</strong></div><div class="stat"><small>보증금 면제</small><strong>300 P</strong></div></div><section class="card"><h2>포인트 내역</h2><p class="sub">체험용 수치입니다. 현금으로 사용할 수 없습니다.</p>${state.ledger.map(x=>`<div class="item row between"><div><strong>${esc(x.text)}</strong><div class="sub" style="margin:3px 0">${date(x.date)}</div></div><b>${x.amount>0?'+':''}${num(x.amount)} P</b></div>`).join('')}</section>`}
function rank(){let month=new Date().toISOString().slice(0,7);let score=state.rentals.filter(r=>r.returned&&r.region===state.region&&r.returnDate.slice(0,7)===month).length*100;let data=[{name:'초록친구 (예시)',score:900},{name:'순환마스터 (예시)',score:600},{name:'에코산책 (예시)',score:300}];if(state.public)data.push({name:'나',score});data.sort((a,b)=>b.score-a.score);app.innerHTML=`<section class="card"><div class="row between"><div><h2>우리 동네 순위</h2><p class="sub">${esc(state.region)} · ${month} · 이 브라우저 기준</p></div><span class="pill">월간 반납 적립 기준</span></div><div class="two"><div><label class="label" for="region">활동 지역 직접 입력</label><input id="region" class="field" maxlength="40" value="${esc(state.region)}"></div><div><label class="label" for="public">순위 공개</label><select class="field" id="public"><option value="yes" ${state.public?'selected':''}>참여</option><option value="no" ${!state.public?'selected':''}>비공개</option></select></div></div><button class="btn secondary" onclick="saveRank()">설정 저장</button><p class="notice">다른 참가자는 가상 예시이며 실제 순위가 아닙니다. 지역 변경 전 적립 점수는 원래 지역에 남습니다.</p>${data.map((x,i)=>`<div class="rank ${x.name==='나'?'mine':''}"><b>${data.findIndex(y=>y.score===x.score)+1}</b><strong>${esc(x.name)}</strong><span>${num(x.score)} P</span></div>`).join('')}<p class="sub" style="margin:16px 0 0">내 점수 ${num(score)}P · 포인트 사용은 순위 점수에 영향을 주지 않습니다.</p></section>`}
function saveRank(){let value=document.getElementById('region').value.trim();if(!value)return alert('활동 지역을 입력해 주세요.');state.region=value;state.public=document.getElementById('public').value==='yes';save();render()}
function operator(){let pending=state.cafes.filter(c=>c.status!=='approved');app.innerHTML=`<div class="grid"><section class="card"><h2>카페 등록 신청</h2><p class="sub">등록 후 관리자 메뉴에서 모의 승인할 수 있습니다.</p><form id="cafeForm"><label class="label">카페명<input class="field" name="name" required maxlength="50"></label><label class="label">주소<input class="field" name="address" required maxlength="100"></label><div class="two"><label class="label">연락처<input class="field" name="phone" required maxlength="30"></label><label class="label">영업시간<input class="field" name="hours" required maxlength="50" placeholder="예: 09:00–18:00"></label></div><label class="label">초기 이용 가능 컵 수<input class="field" name="stock" type="number" min="0" max="1000" value="5" required></label><button class="btn">등록 신청</button></form><p class="notice">파일 제출·실제 사업자 검증은 제공되지 않습니다. 개인 정보나 증빙 자료를 입력하지 마세요.</p></section><section class="card"><h2>재고 관리</h2><p class="sub">세척 완료 시 재고를 다시 사용할 수 있습니다.</p>${state.cafes.map(c=>`<div class="item"><div class="row between"><strong>${esc(c.name)}</strong><span class="pill">${c.status==='approved'?'승인됨':c.status==='rejected'?'반려':'심사 대기'}</span></div><p class="sub" style="margin:5px 0">이용 가능 ${c.stock}개 · 세척 대기 ${c.wash||0}개</p>${c.wash?`<button class="btn secondary" onclick="wash('${c.id}')">세척 완료 1개</button>`:''}</div>`).join('')}</section></div>`;document.getElementById('cafeForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.cafes.push({id:'c'+Date.now(),name:String(f.get('name')).trim(),address:String(f.get('address')).trim(),phone:String(f.get('phone')).trim(),hours:String(f.get('hours')).trim(),stock:Number(f.get('stock')),wash:0,status:'pending'});save();render();alert('등록 신청을 저장했습니다. 관리자 메뉴에서 모의 심사할 수 있습니다.')}}
function wash(id){let c=state.cafes.find(x=>x.id===id);if(c&&c.wash>0){c.wash--;c.stock++;save();render()}}
function admin(){let p=state.cafes.filter(c=>c.status==='pending');app.innerHTML=`<section class="card"><h2>매장 등록 심사</h2><p class="sub">권한 확인이 없는 체험용 화면입니다. 실제 심사가 아닙니다.</p>${p.length?p.map(c=>`<div class="item"><strong>${esc(c.name)}</strong><p class="sub" style="margin:6px 0">${esc(c.address)} · ${esc(c.phone)} · ${esc(c.hours)}</p><div class="row"><button class="btn" onclick="review('${c.id}','approved')">모의 승인</button><button class="btn secondary" onclick="review('${c.id}','rejected')">모의 반려</button></div></div>`).join(''):'<div class="empty">심사 대기 중인 신청이 없습니다.</div>'}<div class="notice">주의: 이 화면은 누구나 접근할 수 있고 데이터가 개인 브라우저에 저장됩니다. 실제 서비스 관리에 사용하지 마세요.</div><button class="btn secondary" onclick="resetDemo()">체험 데이터 초기화</button></section>`}
function review(id,status){let c=state.cafes.find(x=>x.id===id);if(c&&c.status==='pending'){c.status=status;save();render()}}function resetDemo(){if(confirm('이 브라우저의 체험 데이터를 모두 초기화할까요?')){localStorage.removeItem(KEY);location.reload()}}render();
</script></body></html>
